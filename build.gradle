plugins {
    // see https://maven.fabricmc.net/fabric-loom/fabric-loom.gradle.plugin/maven-metadata.xml for new versions
    id 'net.fabricmc.fabric-loom' version '1.17.21' apply false
    // see https://projects.neoforged.net/neoforged/moddevgradle for new versions
    id 'net.neoforged.moddev' version '2.0.148' apply false
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}

subprojects {
    apply plugin: 'java'
    java.toolchain.languageVersion = JavaLanguageVersion.of(java_version)

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = Integer.parseInt(java_version)
    }

    tasks.withType(Javadoc).configureEach {
        enabled = false
    }
}

tasks.register('cleanOutJars', Delete) {
    group = 'dev-run'
    description = 'Cleans the out_jars folder.'
    delete layout.projectDirectory.dir('out_jars')
}

tasks.register('copyJars', Sync) {
    group = 'build'
    description = 'Copies the final JAR files to the out_jars folder.'

    dependsOn(':common:check', ':neoforge:build', ':fabric:build', ':forge:build')

    subprojects.forEach { subproject ->
        if (subproject.name != 'common') {
            from(subproject.layout.buildDirectory.dir('libs')) {
                include "${mod_id}-${subproject.name}-${minecraft_version}-${version}.jar"
            }
        }
    }

    into layout.projectDirectory.dir('out_jars')
}

tasks.register('buildAll') {
    group = 'dev-run'
    description = 'Checks and builds all loaders, then synchronizes the release JARs to out_jars.'
    dependsOn 'copyJars'
}

tasks.register('Fabric_runClient') {
    group = 'dev-run'
    description = 'Run Fabric client'
    dependsOn ':fabric:runClient'
}

tasks.register('Fabric_runServer') {
    group = 'dev-run'
    description = 'Run Fabric server'
    dependsOn ':fabric:runServer'
}

tasks.register('Forge_runClient') {
    group = 'dev-run'
    description = 'Run Forge client'
    dependsOn ':forge:runClient'
}

tasks.register('Forge_runServer') {
    group = 'dev-run'
    description = 'Run Forge server'
    dependsOn ':forge:runServer'
}

tasks.register('NeoForge_runClient') {
    group = 'dev-run'
    description = 'Run NeoForge client'
    dependsOn ':neoforge:runClient'
}

tasks.register('NeoForge_runServer') {
    group = 'dev-run'
    description = 'Run NeoForge server'
    dependsOn ':neoforge:runServer'
}
