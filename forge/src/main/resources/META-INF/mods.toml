modLoader = "javafml"
loaderVersion = "${forge_loader_version_range}"
license = "${license}"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
credits = "${credits}"
authors = "${mod_author}"
description='''
Extended Beacon Range is a quality-of-life mod that modifies the base range for all Beacon levels, increasing it to x3 the original effect radius.

- Level 1: 60 blocks
- Level 2: 90 blocks
- Level 3: 120 blocks
- Level 4: 150 blocks
'''

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "[${forge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
