# Important Notes:
# Every field you add must be added to the root build.gradle expandProps map.

# Project
version=2.0.0
group=com.javiluli.extendedbeaconrange
java_version=25

# Common
minecraft_version=26.2
mod_name=Extended Beacon Range
mod_author=Javiluli
mod_id=extendedbeaconrange
license=MIT
credits=
description=Extended Beacon Range is a lightweight quality-of-life mod that makes Beacons stronger and easier to read in-game.\n\nFeatures:\n- Multiplies every Beacon effect radius by x3\n- Adds an optional perimeter overlay to visualize Beacon coverage\n- Supports global and targeted perimeter toggling with a configurable keybind\n\nRange by pyramid level:\n- Level 1: 60 blocks\n- Level 2: 90 blocks\n- Level 3: 120 blocks\n- Level 4: 150 blocks
minecraft_version_range=[26.2, 26.3)
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.2-1

# Fabric
fabric_version=0.152.1+26.2
fabric_loader_version=0.19.3

# Forge
forge_version=65.0.9
forge_loader_version_range=[65,)

# NeoForge
neoforge_version=26.2.0.1-beta
neoforge_loader_version_range=[4,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
